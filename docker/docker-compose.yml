# CompreFace self-hosted — verifikasi wajah Absenizer (BR-36, Q-04)
#
# Menjalankan CompreFace (face recognition open-source) via Docker di VPS
# perusahaan. Gratis selamanya, tanpa batas kuota, dan data biometrik
# karyawan tidak keluar ke cloud pihak ketiga (mendukung UU PDP).
#
# Cara pakai:
#   cd docker
#   docker compose up -d
#   # buka http://<vps>:8000  -> buat user admin -> catat API key
#
# Alur verifikasi (diimplementasikan di backend/Fase 2):
#   1. Daftarkan foto referensi: POST /api/v1/recognition/faces
#      dengan subject = employee id (face plugin: face_detection + face_recognition).
#   2. Saat clock in: POST foto selfie ke endpoint verify dengan subject
#      employee id -> dapatkan similarity (0..1).
#   3. Bandingkan dengan threshold 0.6 (FACE_MATCH_THRESHOLD): di bawah itu
#      -> soft-flag "Wajah tidak cocok", absensi TETAP disimpan (BR-10).
#
# Alternatif sepadan: DeepFace (deepface service) — ganti image/service di bawah.

services:
  compreface:
    image: exadel/compreface:latest
    container_name: absenizer-compreface
    restart: unless-stopped
    ports:
      # Ganti 8000 bila bentrok; sesuaikan EXPO_PUBLIC_FACE_API_URL di mobile/.env
      - "${FACE_PORT:-8000}:8000"
    environment:
      # Kunci API CompreFace — JANGAN commit nilai aslinya.
      - API_KEY=${FACE_API_KEY:-ganti-dengan-kunci-acak}
    volumes:
      - compreface-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/status"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  compreface-data:
